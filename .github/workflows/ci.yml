name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:guard
      - name: keyscan PR commits
        if: github.event_name == 'pull_request'
        run: pnpm keyscan --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: keyscan pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm keyscan --range ${{ github.event.before }}..${{ github.sha }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The requirement-trace matrix (plan phase P9t): every assignment sentence and user
      # modification has a row with code, tests, a UI screen and action, evidence and an expect.
      - name: requirement trace
        run: pnpm cli trace-check
      - run: pnpm build
      - run: pnpm fixtures:verify
      - run: pnpm fixtures:lint
      - name: keyscan working tree and build output
        run: pnpm keyscan

  # The grader validation matrix (plan phase P9) runs beside check, one job per task with tests,
  # offline: canned judge outputs, no key, no live call; a judge cache miss fails that task's job.
  # The task list comes from the repo, so a new task needs no edit here.
  tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: list
        run: |
          ids=$(pnpm --silent cli matrix --list-tasks)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  matrix:
    name: matrix (${{ matrix.task }})
    needs: tasks
    runs-on: ubuntu-latest
    # The slowest task took about 2 minutes on 16 local cores. The runner has 4 vCPUs and the
    # isolation pass grades 3 cases at a time there instead of 8, so allow 5x plus setup, with margin.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.tasks.outputs.ids) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: grader validation matrix
        env:
          TASK: ${{ matrix.task }}
        run: pnpm cli matrix --task "$TASK"

  # One check name for branch protection however many tasks the matrix fans out to. always()
  # makes it run, and fail, when a matrix job fails or the task list cannot be built.
  matrix-ok:
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.matrix.result }}
        run: test "$RESULT" = success

  # Browsers and their system libraries come from the image, so this job installs nothing
  # with apt. The tag must equal @playwright/test in apps/web/package.json
  # (scripts/test/ci-workflow.test.ts fails when they drift).
  # Playwright shards by test count over files in order, so --shard=i/n alone would put all seven
  # 'grader validation in the tab' tests in shard 1; six of them run a task's matrix (2-6 min each
  # on this runner). They get three shards of their own; --grep-invert of the same title runs
  # every other test in the fourth.
  # ci-guard wants literal Playwright arguments, so each shard has its own step.
  e2e:
    name: e2e (${{ matrix.shard }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [grader-1, grader-2, grader-3, rest]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Firefox will not launch as root when $HOME belongs to another user; the runner mounts
      # $HOME owned by uid 1001.
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright.config.ts serves the build with vite preview.
      - run: pnpm build
      - if: matrix.shard == 'grader-1'
        run: pnpm --filter web exec playwright test --project=mocked --grep "grader validation in the tab" --shard=1/3
      - if: matrix.shard == 'grader-2'
        run: pnpm --filter web exec playwright test --project=mocked --grep "grader validation in the tab" --shard=2/3
      - if: matrix.shard == 'grader-3'
        run: pnpm --filter web exec playwright test --project=mocked --grep "grader validation in the tab" --shard=3/3
      - if: matrix.shard == 'rest'
        run: pnpm --filter web exec playwright test --project=mocked --project=xbrowser --grep-invert "grader validation in the tab"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  # One check name for the e2e shards, as matrix-ok is for the matrix.
  e2e-ok:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success

# Each trap needs a mutant in tests/mutants.ts. T6 has inbox items, so a status-only agent must fail.
[matrix]
traps = ["stale_monitoring", "bmp_order", "conflict_in_note", "red_flag", "hidden_reaction", "places_alternative", "allergy_coding", "renewal_terms", "scheduling_route", "closure", "evidence_before_writes"]
status_only = true

# The judge items read one message and quote it; medium as in T1, checked by the live judge pass.
[judge]
effort = "medium"
